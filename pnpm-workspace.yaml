packages:
  - "apps/*"
  - "packages/*"

allowedDeprecatedVersions:
  glob: "*"

overrides:
  "@nestjs/swagger>js-yaml": ">=4.3.2 <5"
  "@nestjs/platform-express>multer": ">=2.5.0 <3"
  tar: ">=7.5.8"
  lodash: ">=4.17.21"
  postcss: ">=8.5.10"

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  prisma: true
  sharp: true
  unrs-resolver: true
